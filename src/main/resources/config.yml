      - "§7Charged hits  §f»  §7{pct:blindness-chance} chance to blind for §f{s:blindness-duration}"
      - "§7Ability (after {n:kills-per-stage}x3 kills)  §f»  §7split in two for {s:dual-wield-duration}"
