# ============================================================================
#  LumiWeapons (formerly LegendaryWeapons) / Luminara  --  plugin 1.3
# ============================================================================
#
#  EDITING
#    In game: /lw (Admin Panel) > Server Settings edits every setting here, with these comments
#    as help, and applies changes straight away. A setting changed from the default shows a ✎;
#    Ctrl+Q on it puts the default back.
#    By hand: edit this file, then /lw reload.
#    /lw checkconfig lists any setting that won't work as written (a typo, an unknown item, a
#    bad colour or time...). The same list goes to the console on start, and the settings menu
#    marks those settings with ⚠. A setting that won't work falls back to its default.
#
#  WHERE THINGS ARE
#    audio, effects, hud ........ sounds, particles, the action bar
#    protection, trust-system ... who abilities can touch
#    acquisition, fragments ..... how legendaries are obtained; fragment drops
#    passives ................... off-hand passives
#    weapons .................... every legendary's numbers, enchantments and ritual recipe
#    ritual, ritual-block-recipe  altars, Ancient Altars, ritual times (Central Time by default)
#    events ..................... bounty, KotH, supply drops, Fallen Star, Blood Moon,
#                                 Most Wanted, the Chosen, relics, loot tables
#    director ................... the Event Director's daily windows
#    teams ...................... the captain draft, nametags, team chat
#    outposts, token-shop ....... capture points, tokens and the Token Trader
#    bosses ..................... the four world bosses
#    tools, messages ............ Amethyst tools; chat text
#
#  UNITS
#    Durations are in TICKS unless the name or comment says otherwise. 20 ticks = 1 second.
#    Settings named ...-seconds or ...-minutes, and comments that say SECONDS, are in seconds
#    (ritual.timer and weapons.<weapon>.ritual-time too).
#    Damage is in half-hearts: a player has 20 health = 10 hearts.
#
#  DAMAGE REFERENCE (for balancing)
#    Netherite sword 8  |  Netherite axe 10  |  Trident 9
#    Sharpness V adds +3.0, Sharpness IV adds +2.5.
#
#  LORE PLACEHOLDERS -- lore reads its numbers from the weapon's abilities section, so the
#  tooltip can never disagree with the real value:
#    {s:key}   ticks as seconds        {s:dash-cooldown}          200  -> 10s
#    {n:key}   plain number            {n:combo-hits-required}    5    -> 5
#    {h:key}   damage as hearts        {h:supernova-damage}       20.0 -> 10
#    {pct:key} fraction as a percent   {pct:enlarge-chance}       0.12 -> 12%
#    {x:key}   multiplier              {x:backstab-damage-multiplier} -> 1.35x
#  Weapons players already own get their name and lore refreshed automatically.
#
#  UPGRADING: when this file is older than the plugin's config version it is saved as
#  config-v<old>-backup.yml and replaced with these defaults. Copy custom edits back by hand.
#
# ============================================================================
config-version: 4
balance-revision: 8                 # retuned defaults applied so far (see ConfigManager.RETUNED); leave alone


# ============================================================================
#  Audio -- stacked flavour sounds mask the cues PvP depends on (footsteps, bows, crits).
#  Long droning sounds (beacons, conduits, the old "dragon" roar) were all replaced by short cues.
# ============================================================================
audio:
  volume: 0.6        # master multiplier for every sound the plugin plays; 0 = silent
  hit-sounds: false  # extra per-swing sounds on top of vanilla's own attack sound
  ambient: false     # flavour loops and projectile trails


# ============================================================================
#  Effects -- particles
#
#  Particles are sent to each player separately, which is what allows:
#    - density:          global thinning of every effect (0..1)
#    - /lwfx:            each player picks full / reduced / minimal / off for themselves
#    - eye-clearance:    small effects that would sit right in front of a player's eyes are
#                        not shown to that player, so nobody's view gets buried
# ============================================================================
effects:
  particles: true
  animations: true                # short ground-level ability animations (display blocks, <1s, hidden for /lwfx off)
  # Textured effects from the resource pack, one per ability, in each weapon's colours (slashes,
  # bursts, ground rings; SuperNova and the Eclipse split get their own). Hidden for /lwfx minimal
  # and off, and never shown to someone a burst lands on. With this off, those
  # moments use the particle/display-block versions instead. Players WITHOUT the resource pack see
  # placeholder blocks for sprites, so turn this off if the pack is optional on your server.
  sprites: true
  sprite-flip: false              # set true only if slashes curve away behind the player instead of in front
  density: 0.4
  default-player-level: REDUCED   # FULL, REDUCED, MINIMAL or OFF for players who never ran /lwfx
  view-range: 48.0                # blocks; particles further away are not sent at all
  eye-clearance: 1.3              # blocks
  passive-auras: false            # always-on auras around HELD weapons (Sword of Eclipse). Off: they blocked vision.
  trails: true
  # Ritual altars are drawn at this strength regardless of density and /lwfx (except "off"):
  # they are a landmark people navigate to, not combat clutter.
  ritual-density: 1.0


# ============================================================================
#  HUD -- the action bar shows cooldowns, charges and meters for the weapon you hold, your
#  Veil disguise, and your bounty target during a Bounty Hunt.
# ============================================================================
hud:
  enabled: true
  message-hold-millis: 1600       # how long an ability message stays before the HUD returns


# ============================================================================
#  Protection -- abilities respect WorldGuard's pvp flag and Towny PvP (detected automatically),
#  and the world's own pvp setting. Knockback, slows, freezes, pulls and resizes all check it.
#  Block-changing abilities (Hellstorm's explosion, the water wall, SuperNova with block
#  breaking on) check build permission with a synthetic BlockBreakEvent.
# ============================================================================
protection:
  block-probe: true               # set false if a logging plugin records the synthetic events


# ============================================================================
#  How legendaries are obtained
# ============================================================================
acquisition:
  ritual-crafting: true           # legendaries are forged at a Ritual Altar
  require-fragments: true         # false strips Weapon Fragment entries from every recipe
  single-craft-per-weapon: true   # one of each legendary per server (breaking a running ritual frees it again)
  fragment-fusion: true           # fragments.fusion-cost of one tier fuse into one of the next at the altar


# ============================================================================
#  Amethyst tools -- DonutSMP-style 3x3 pickaxe/shovel and tree-felling axe.
#  Give with /lwtest give AMETHYST_PICKAXE (or _SHOVEL/_AXE) or the give menu.
# ============================================================================
tools:
  sneak-to-disable: true      # sneaking mines a single block
  durability-per-block: 1     # per extra block broken (Unbreaking applies)
  max-hardness: 40.0          # never breaks anything harder (obsidian is 50, bedrock is unbreakable)
  blacklist: []               # extra materials the 3x3 must never touch, e.g. [ANCIENT_DEBRIS]
  axe:
    max-logs: 300
    break-leaves: true        # also clear the tree's natural leaves (drops saplings/apples)
    require-leaves: true      # only fell real trees, so log builds are safe

# ============================================================================
#  Weapon fragments -- Tier I..IV, plus the Luminosity Fragment (events only)
# ============================================================================
fragments:
  fusion-cost: 4
  # Kills by a player only. ENTITY_TYPE: "tier:chance"
  mob-drops:
    ENDER_DRAGON: "4:1.0"
    WITHER: "3:0.6"
    WARDEN: "3:0.5"
    ELDER_GUARDIAN: "2:0.4"
    RAVAGER: "2:0.1"
    EVOKER: "1:0.2"
    PIGLIN_BRUTE: "1:0.1"
    BREEZE: "1:0.05"

# ============================================================================
#  Off-hand passives -- a legendary in your off-hand gives its PASSIVES (not
#  its abilities), so you can combine two: your main weapon's and this one's.
#  Weapons with passives: Scythe of Diablo, Axe of Zeus, Hermes's Blade,
#  Chione's Blade, Titan's Axe, Blade of Diminution.
# ============================================================================
passives:
  off-hand: true                # false = passives only work from the main hand
  off-hand-strength: FULL       # FULL, or REDUCED: multipliers, chances and durations x reduced-multiplier
  reduced-multiplier: 0.5

# Ultimates: the ability key is Ability 1, sneak + ability key is Ability 2. Tap the ability key
# twice quickly while the weapon's meter is full to fire its ultimate.
ultimates:
  double-tap-millis: 400        # how quickly the second tap must follow the first


# ============================================================================
#  Weapons -- name, item, model, power tier, numbers, enchantments and ritual
#  recipe. The tooltip text is in lore.yml and fills in these numbers itself.
#  Ticks: 20 = 1 second. Damage: 2 = 1 heart.
# ============================================================================
weapons:

  # ---- Scythe Of Diablo -- netherite sword + Sharpness V = 11 base damage
  scythe-of-diablo:
    display-name: "§c§lScythe Of Diablo"
    ritual-colors: ["#D4142C", "#E8B040"]   # ritual colours: main (outer circle, pylons, sky beam), accent (inner circle, beams)
    material: NETHERITE_SWORD
    custom-model-data: 1
    power-tier: 3
    abilities:
      backstab-damage-multiplier: 1.35
      sweep-damage-multiplier: 1.25
      combo-hits-required: 5
      combo-absorption-duration: 200    # 10s
      combo-absorption-amplifier: 0     # 0 = Absorption I = 2 hearts
    enchantments: [SHARPNESS:5, LOOTING:3]
    recipe: [NETHERITE_SWORD, BEACON, TOTEM_OF_UNDYING, FRAGMENT_T3:2]

  # ---- Ender Glaive -- netherite sword = 8 base damage
  ender-glaive:
    display-name: "§5§lEnder Glaive"
    ritual-colors: ["#B14CFF", "#2FBF6F"]
    material: NETHERITE_SWORD
    custom-model-data: 2
    power-tier: 1
    abilities:
      spear-damage: 5.0
      melee-damage: 0.0                 # 0 = normal sword damage (with Sharpness, crits, Strength)
      max-charge-time: 3000             # MILLISECONDS of hold for a full charge
      max-throw-strength: 2.0
      throw-cooldown: 80                # 4s, from the throw (the glaive still has to come back)
      pearl-cooldown: 200               # 10s
    enchantments: [UNBREAKING:3]
    recipe: [DIAMOND_SWORD, ENDER_PEARL:16, GHAST_TEAR:4, FRAGMENT_T1:2]

  # ---- Axe Of Zeus -- netherite axe + Sharpness V = 13 base damage
  axe-of-zeus:
    display-name: "§b§lAxe Of Zeus"
    ritual-colors: ["#FFF35A", "#4FC3FF"]
    material: NETHERITE_AXE
    custom-model-data: 3
    power-tier: 3
    abilities:
      throw-damage: 8.0
      throw-armour-pierce: 0.25         # share of the throw that ignores armour and Protection
      throw-stun-duration: 40           # 2s
      throw-weakness-duration: 100      # 5s
      melee-stun-duration: 20           # 1s
      melee-lightning-chance: 0.1
      shield-break-duration: 160        # 8s (vanilla axes: 5s)
      throw-cooldown: 200               # 10s
      projectile-speed: 1.6
      return-speed: 2.0
      max-travel-distance: 40.0
      spin-degrees-per-tick: 50.0
      projectile-lifetime: 200
    enchantments: [SHARPNESS:5, LOYALTY:3]
    recipe: [NETHERITE_AXE, LIGHTNING_ROD, COPPER_BLOCK:4, FRAGMENT_T3:2]

  # --------------------------------------------------------------------------
  # Sword Of Eclipse -- netherite sword + Sharpness IV = 10.5, plus stage bonus
  # Main hand only: it cannot be moved into the off-hand, and the split blades cannot be
  # dropped, moved or stored.
  # --------------------------------------------------------------------------
  sword-of-eclipse:
    display-name: "§d§lSword Of Eclipse"
    ritual-colors: ["#7A4CF0", "#FFC45C"]
    material: NETHERITE_SWORD
    custom-model-data: 4
    power-tier: 4
    abilities:
      kills-per-stage: 3
      blindness-chance: 0.25
      blindness-duration: 60           # ticks (was a fixed 5s)
      stage-1-damage-bonus: 0
      stage-2-damage-bonus: 1
      stage-3-damage-bonus: 2
      stage-4-damage-bonus: 3
      dual-wield-duration: 200          # 10s
      light-model-data: 15              # resource-pack models the split halves wear (Light / Dark Sword)
      dark-model-data: 16
      dual-wield-cooldown: 1200         # 60s
      max-health-bonus: 2.0             # 1 heart per kill
      max-health-bonus-cap: 6.0         # 3 hearts maximum
    enchantments: [SHARPNESS:4, FIRE_ASPECT:2]
    recipe: [DRAGON_EGG, DIAMOND_SWORD, NETHER_STAR, FRAGMENT_T4:2]

  # --------------------------------------------------------------------------
  # Hellstorm -- a volley weapon on a long cooldown. The heavy arrow can break blocks
  # (only where the shooter is allowed to build).
  # --------------------------------------------------------------------------
  hellstorm:
    display-name: "§e§lHellstorm"
    ritual-colors: ["#FF8A00", "#FFE070"]
    material: CROSSBOW
    custom-model-data: 5
    power-tier: 3
    abilities:
      arrow-count: 5
      normal-arrow-damage: 4.0
      explosive-arrow-damage: 12.0
      explosive-arrow-power: 2.5
      fire-ticks: 100
      volley-interval: 3                # ticks between volley arrows (was 5)
      arrow-speed: 3.2                  # vanilla crossbow is 3.15
      cooldown: 600                     # 30s; between volleys it shoots normal bolts
    enchantments: [QUICK_CHARGE:3, MULTISHOT:1]
    recipe: [CROSSBOW, FIRE_CHARGE:64, TNT:16, FRAGMENT_T3:2]

  # ---- Lost Trident Of Atlantis -- trident = 9 base damage
  lost-trident-of-atlantis:
    display-name: "§3§lLost Trident Of Atlantis"
    ritual-colors: ["#2FD8C8", "#DDE4EA"]
    material: TRIDENT
    custom-model-data: 6
    power-tier: 2
    melee:                              # swings like a sword, hits like a netherite sword
      attack-damage: 8.0
      attack-speed: 1.6
    abilities:
      throw-cooldown: 80                # 4s between throws (the trident greys out until then)
      pulse-radius: 4.0
      pulse-damage: 6.0
      water-pulse-knockback: 1.5
      water-wall-width: 7
      water-wall-height: 4
      water-wall-duration: 100          # 5s
      water-wall-push: 0.9
      water-wall-cooldown: 160          # 8s
      water-wall-blocks-projectiles: true   # enemy arrows, tridents and pearls stop in the wall
      water-wall-slowness: 30           # ticks of Slowness II on enemies inside the wall
      water-wall-crash-damage: 4.0      # the wave when the wall ends
      water-wall-crash-range: 5.0
    enchantments: [LOYALTY:3, IMPALING:5]
    recipe: [TRIDENT, HEART_OF_THE_SEA, PRISMARINE_CRYSTALS:32, FRAGMENT_T2:2]

  # ---- Hermes's Blade -- netherite sword = 8 base damage
  hermes-blade:
    display-name: "§f§lHermes's Blade"
    ritual-colors: ["#5AB4FF", "#F2C45A"]
    material: NETHERITE_SWORD
    custom-model-data: 7
    power-tier: 1
    abilities:
      kills-for-speed-1: 1
      kills-for-speed-2: 2
      speed-refresh-ticks: 40
      dash-power: 1.4
      dash-lift: 0.25
      dash-cooldown: 100                # 5s
      dash-duration: 8
      dash-hit-radius: 1.6
      dash-slowness-duration: 60        # 3s
      dash-slowness-amplifier: 1
    enchantments: [SHARPNESS:4]
    recipe: [NETHERITE_SWORD, FEATHER:64, SUGAR:64, FRAGMENT_T1:2]

  # --------------------------------------------------------------------------
  # Chione's Blade -- netherite sword = 8 base damage
  # Freeze is movement/jump attributes set to zero (no velocity pinning, so no launch when it
  # ends), with the vanilla powder-snow frost overlay on top.
  # --------------------------------------------------------------------------
  chiones-blade:
    display-name: "§b§lChione's Blade"
    ritual-colors: ["#BDEFFF", "#3F78B0"]
    material: NETHERITE_SWORD
    custom-model-data: 8
    power-tier: 2
    abilities:
      combo-hits-required: 5
      combo-window-millis: 3000         # MILLISECONDS between hits before the streak resets
      freeze-duration: 30               # 1.5s
      freeze-immunity: 100              # 5s after a freeze ends
      freeze-overlay: true              # powder-snow frost vignette on the frozen player
      cold-ground-speed-amplifier: 1    # Speed II
      ice-wave-cooldown: 240            # 12s
      ice-wave-range: 12.0              # blocks
      ice-wave-speed: 0.9               # blocks per tick
      ice-wave-width: 2.0               # half-width of the crest
      ice-wave-damage: 0.0
      ice-wave-slowness-duration: 80    # 4s
      ice-wave-slowness-amplifier: 1    # Slowness II
      frost-duration: 120               # 6s of frost left on the ground
    enchantments: [SHARPNESS:3]
    recipe: [NETHERITE_SWORD, POWDER_SNOW_BUCKET, BLUE_ICE:16, FRAGMENT_T2:2]

  # --------------------------------------------------------------------------
  # Titan's Axe -- netherite axe = 10 base damage
  # Anti-spam: charge only from player hits, a per-victim limit, drain out of combat, a visible
  # wind-up and a 30s cooldown.
  # --------------------------------------------------------------------------
  titans-axe:
    display-name: "§6§lTitan's Axe"
    ritual-colors: ["#FF4A14", "#C88A40"]
    material: NETHERITE_AXE
    custom-model-data: 9
    power-tier: 3
    abilities:
      crit-streak-required: 3
      crit-streak-window-millis: 4000
      crit-streak-armour-damage: 15     # durability per armour piece
      shield-break-duration: 160        # 8s (vanilla axes: 5s)
      slam-charge-max: 100.0
      slam-charge-per-hit: 10.0         # 10 charged player hits to full
      slam-charge-required: 100.0
      charge-from-mobs: false
      charge-victim-cooldown: 10        # the same victim can feed the meter every 0.5s
      charge-drain-delay: 200           # 10s out of combat before draining
      charge-drain-per-second: 2.0
      slam-cooldown: 600                # 30s
      slam-windup: 12                   # 0.6s telegraph
      slam-radius: 6.0
      slam-damage: 14.0                 # at the centre; falls to slam-edge-damage of it at the rim
      slam-edge-damage: 0.4
      slam-armour-pierce: 0.4           # share of the hit that ignores armour and Protection
      slam-knockback: 1.6
      slam-armour-damage: 40            # at the epicentre, falling to 0 at the rim
    enchantments: [SHARPNESS:4, UNBREAKING:3]
    recipe: [NETHERITE_AXE, ANCIENT_DEBRIS:8, ANVIL, FRAGMENT_T3:2]

  # --------------------------------------------------------------------------
  # Blade of Diminution -- netherite sword = 8 base damage
  # Diminish shrinks YOU (never anyone else). Sizes are attribute modifiers, removed on
  # death, respawn, quit and join, so nobody can be left stuck at the wrong size.
  # --------------------------------------------------------------------------
  blade-of-diminution:
    display-name: "§d§lBlade of Diminution"
    ritual-colors: ["#C8B0FF", "#E8A83A"]
    material: NETHERITE_SWORD
    custom-model-data: 10
    power-tier: 2
    abilities:
      hold-speed-amplifier: 0           # Speed I
      diminish-scale: 0.6               # 0.2 - 3.0
      diminish-duration: 160            # 8s
      diminish-cooldown: 400            # 20s
      scale-reach: true                 # attack and block reach scale with your size
      regrow-timeout: 200               # waits up to 10s for room to grow back, then forces it
      enlarge-chance: 0.12
      enlarge-scale: 1.3
      enlarge-duration: 100             # 5s
      enlarge-target-cooldown: 200      # the same target cannot be enlarged again for 10s after
      fix-legacy-scale: true            # reset sizes stuck by 1.1 on join
    enchantments: [SHARPNESS:3]
    recipe: [NETHERITE_SWORD, ECHO_SHARD:8, AMETHYST_BLOCK:4, FRAGMENT_T2:2]

  # --------------------------------------------------------------------------
  # Luminosity -- the mace. Keeps vanilla's fall-damage smash on top of this.
  # SuperNova telegraphs itself (charge-up sound, warning ring, warning to anyone inside) and
  # its damage goes through armour, capped at a share of the target's max health.
  # --------------------------------------------------------------------------
  luminosity:
    display-name: "§e§lLuminosity"
    ritual-colors: ["#FFE08A", "#86A6E6"]
    material: MACE
    custom-model-data: 11
    power-tier: 4
    abilities:
      dash-charges: 2
      dash-recharge: 160                # 8s per charge
      dash-lockout: 60                  # 3s after the last charge is spent
      dash-power: 1.5
      dash-lift: 0.35
      ultimate-charge-max: 100.0
      ultimate-charge-per-hit: 8.0      # 13 hits to full
      charge-from-mobs: false
      ultimate-victim-cooldown: 10      # the same victim can feed the meter every 0.5s
      charge-drain-delay: 200           # 10s out of combat before draining
      charge-drain-per-second: 2.0
      supernova-min-charge: 25.0
      supernova-windup: 10              # 0.5s hover + warning before the slam
      supernova-launch: 0.9
      supernova-slam-velocity: -2.2
      supernova-max-fall-ticks: 60
      supernova-radius: 7.0             # at 100%; scales down with charge
      supernova-damage: 20.0            # at 100% charge, at the centre (half of it at the minimum charge)
      supernova-edge-damage: 0.5        # fraction of that still dealt at the rim (linear falloff)
      supernova-armour-pierce: 0.5      # fraction of each hit that ignores armour
      supernova-max-health-fraction: 0.6
      supernova-knockback: 1.8
      supernova-glow-duration: 60      # ticks targets hit by SuperNova glow (0 = off)
      supernova-break-blocks: false     # only where the user may build, even when on
      supernova-block-power: 2.0
    enchantments: [DENSITY:5, UNBREAKING:3]
    recipe: [MACE, NETHER_STAR, END_CRYSTAL:4, FRAGMENT_T4:2, LUMINOSITY_FRAGMENT:3]

  # --------------------------------------------------------------------------
  # Veil of Mimicry -- a book. Deals no damage at all.
  # The wearer keeps their own UUID, so bans, permissions and UUID-based logs are unaffected.
  # Disguised chat is written with the REAL sender to the console and veil-chat.log, and shown
  # to anyone with lumiweapons.veil.spy, so a disguise can never be used to frame someone.
  # --------------------------------------------------------------------------
  veil-of-mimicry:
    display-name: "§5§lVeil of Mimicry"
    ritual-colors: ["#2C4FD8", "#E83A3A"]
    material: BOOK
    custom-model-data: 12
    power-tier: 3
    abilities:
      morph-cooldown: 4800              # 4 minutes, after a successful morph
      failed-morph-cooldown: 200        # 10s when someone saw you
      witness-range: 20.0
      witness-fov-degrees: 110.0        # a witness has to be facing you
      sound-mask-range: 16.0
      break-damage-threshold: 8.0       # health lost within break-damage-window that breaks the disguise (8 = 4 hearts, after armour)
      break-damage-window: 60           # ticks (3s) the damage above adds up over; 0 = one hit on its own
      break-health-below: 6.0           # the disguise also drops when you fall to this much health (6 = 3 hearts); 0 = off
      tell-chance: 0.25                 # lighter hits: chance of a brief particle glitch
      tell-duration: 20
      allow-online-targets: true
      require-skin: true                # refuse a morph when no skin can be found
      custom-nametag: true              # Most Wanted: float the alias as a tag (Veil disguises always do, their real name stays on the server)
      reveal-on-commands: [ban, tempban, ban-ip, ipban, kick, mute, tempmute, warn, jail, op, deop, pardon, unban, whitelist]   # staff commands naming a disguise strip it first, so they hit the real owner
    enchantments: []
    recipe: [BOOK, ECHO_SHARD:16, NAME_TAG, FRAGMENT_T3:2]

  # --------------------------------------------------------------------------
  # Tether Chain -- a lead-style weapon. Hooks a target and drags them to you. A target caught
  # mid-dash (Hermes, Luminosity) cannot dash again for a few seconds.
  # --------------------------------------------------------------------------
  tether-chain:
    display-name: "§7§lTether Chain"
    ritual-colors: ["#28D27C", "#F2C85A"]
    material: LEAD
    custom-model-data: 13
    power-tier: 2
    abilities:
      hook-cooldown: 240                # 12s
      hook-range: 18.0
      pull-strength: 1.3
      pull-lift: 0.35
      hook-slowness-duration: 20        # 1s of Slowness I after the pull
      dash-lock-duration: 60            # 3s
    enchantments: [UNBREAKING:3]
    recipe: [LEAD:4, IRON_BLOCK:4, TRIPWIRE_HOOK:2, FRAGMENT_T2:2]

  # --------------------------------------------------------------------------
  # Blade of Talaria -- a sword and its shield in one. The shield floats around you; hold
  # right-click and the blade blocks like a shield, so the off-hand stays free for a totem. Axes
  # disable it for vanilla's normal 5s; the legendary axes' longer shield break doesn't apply.
  # Blocking hits and landing hits fill Divine Ascension: rise in light, untouchable for a while.
  # --------------------------------------------------------------------------
  blade-of-talaria:
    display-name: "§6§lBlade of Talaria"
    ritual-colors: ["#E8C46A", "#C8102E"]
    material: NETHERITE_SWORD
    custom-model-data: 17
    power-tier: 4
