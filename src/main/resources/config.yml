      dash-power: 1.4
      dash-lift: 0.25
      dash-cooldown: 100                # 5s
      dash-duration: 8
      dash-hit-radius: 1.6
      dash-slowness-duration: 60        # 3s
      dash-slowness-amplifier: 1
    enchantments:
      - "SHARPNESS:4"
    recipe:
      - NETHERITE_SWORD
      - FEATHER:64
      - SUGAR:64
      - FRAGMENT_T1:2

  # --------------------------------------------------------------------------
  # Chione's Blade -- netherite sword = 8 base damage
  # Freeze is movement/jump attributes set to zero (no velocity pinning, so no launch when it
  # ends), with the vanilla powder-snow frost overlay on top.
  # --------------------------------------------------------------------------
