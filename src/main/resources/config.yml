      - "§7On hit  §f»  §7stunned {s:throw-stun-duration}, then Weakness {s:throw-weakness-duration}"
      - "§7Returns on its own, hit or miss"
      - "§7Charged melee  §f»  §7{pct:melee-lightning-chance} to strike lightning"
      - "§7Against a shield  §f»  §7disabled {s:shield-break-duration}"
      - ""
      - "§7Cooldown  §f»  §f{s:throw-cooldown}"
    abilities:
      throw-damage: 8.0
      throw-stun-duration: 40           # 2s
      throw-weakness-duration: 100      # 5s
      melee-stun-duration: 20           # 1s
