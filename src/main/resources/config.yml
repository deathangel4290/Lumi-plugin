    display-name: "§b§lChione's Blade"
    material: NETHERITE_SWORD
    custom-model-data: 8
    power-tier: 2
    lore:
      - "§8Her breath stops the blood."
      - ""
      - "§7{n:combo-hits-required} hits on a player  §f»  §7frozen for {s:freeze-duration}"
      - "§8  Then immune to freezing for {s:freeze-immunity}."
      - "§7Ability  §f»  §7Ice Wave, {n:ice-wave-range} blocks"
      - "§8  Slowness II for {s:ice-wave-slowness-duration}, leaves frost for {s:frost-duration}"
      - "§7On frost, ice or snow  §f»  §7Speed II"
      - ""
      - "§7Wave cooldown  §f»  §f{s:ice-wave-cooldown}"
      - "§8Taking a hit resets your combo."
    abilities:
      combo-hits-required: 5
      combo-window-millis: 3000         # MILLISECONDS between hits before the streak resets
      freeze-duration: 30               # 1.5s
      freeze-immunity: 100              # 5s after a freeze ends
      freeze-overlay: true              # powder-snow frost vignette on the frozen player
      cold-ground-speed-amplifier: 1    # Speed II
      ice-wave-cooldown: 240            # 12s
      ice-wave-range: 12.0              # blocks
      ice-wave-speed: 0.9               # blocks per tick
      ice-wave-width: 2.0               # half-width of the crest
      ice-wave-damage: 0.0
      ice-wave-slowness-duration: 80    # 4s
      ice-wave-slowness-amplifier: 1    # Slowness II
      frost-duration: 120               # 6s of frost left on the ground
    enchantments:
      - "SHARPNESS:3"
    recipe:
      - NETHERITE_SWORD
      - POWDER_SNOW_BUCKET
      - BLUE_ICE:16
      - FRAGMENT_T2:2

  # --------------------------------------------------------------------------
  # Titan's Axe -- netherite axe = 10 base damage
  # Anti-spam: charge only from player hits, a per-victim limit, drain out of combat, a visible
  # wind-up and a 30s cooldown.
  # --------------------------------------------------------------------------
  titans-axe:
    display-name: "§6§lTitan's Axe"
    material: NETHERITE_AXE
    custom-model-data: 9
    power-tier: 3
    lore:
      - "§8It does not cut. It ruins."
      - ""
      - "§7{n:crit-streak-required} charged hits  §f»  §7-{n:crit-streak-armour-damage} durability on each armour piece"
      - "§7Against a shield  §f»  §7disabled {s:shield-break-duration}"
      - "§7Each charged hit on a player  §f»  §6+{n:slam-charge-per-hit}% §7Slam"
      - "§7Ability at 100%  §f»  §7Slam: {n:slam-radius} block radius"
      - "§8  Knockback {n:slam-knockback}, up to -{n:slam-armour-damage} armour durability"
      - ""
      - "§7Slam cooldown  §f»  §f{s:slam-cooldown}"
      - "§8The meter drains out of combat."
    abilities:
      crit-streak-required: 3
      crit-streak-window-millis: 4000
      crit-streak-armour-damage: 15     # durability per armour piece
      shield-break-duration: 160        # 8s (vanilla axes: 5s)
      slam-charge-max: 100.0
      slam-charge-per-hit: 10.0         # 10 charged player hits to full
