      - "§7Sweep attacks  §f»  §c{x:sweep-damage-multiplier} §7damage"
      - "§7{n:combo-hits-required} hits on a player  §f»  §7Absorption for {s:combo-absorption-duration}"
      - ""
      - "§8Taking a hit resets your combo. Sweeps build no combo."
