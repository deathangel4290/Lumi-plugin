      backstab-damage-multiplier: 1.35
      sweep-damage-multiplier: 1.25
      combo-hits-required: 5
      combo-absorption-duration: 200    # 10s
      combo-absorption-amplifier: 0     # 0 = Absorption I = 2 hearts
    enchantments:
      - "SHARPNESS:5"
      - "LOOTING:3"
    recipe:
      - NETHERITE_SWORD
      - BEACON
      - TOTEM_OF_UNDYING
      - FRAGMENT_T3:2

  # --------------------------------------------------------------------------
  # Ender Glaive -- netherite sword = 8 base damage
  # --------------------------------------------------------------------------
