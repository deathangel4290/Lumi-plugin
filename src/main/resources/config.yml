# ============================================================================
#  LegendaryWeapons / Luminara  --  config version 2 (plugin 1.2)
# ============================================================================
#
#  UNITS
#    Durations are in TICKS unless the comment says otherwise. 20 ticks = 1 second.
#    The one exception is ritual.timer, which is in seconds.
#    Damage is in half-hearts: a player has 20 health = 10 hearts.
#
#  DAMAGE REFERENCE (for balancing)
#    Netherite sword 8  |  Netherite axe 10  |  Trident 9
#    Sharpness V adds +3.0, Sharpness IV adds +2.5.
#
#  LORE PLACEHOLDERS -- lore reads its numbers from the weapon's abilities section, so the
#  tooltip can never disagree with the real value:
#    {s:key}   ticks as seconds        {s:dash-cooldown}          200  -> 10s
#    {n:key}   plain number            {n:combo-hits-required}    5    -> 5
#    {h:key}   damage as hearts        {h:supernova-damage}       20.0 -> 10
#    {pct:key} fraction as a percent   {pct:enlarge-chance}       0.12 -> 12%
#    {x:key}   multiplier              {x:backstab-damage-multiplier} -> 1.35x
#  Weapons players already own get their name and lore refreshed automatically.
#
#  UPGRADING: when this file is older than the plugin's config version it is saved as
#  config-v<old>-backup.yml and replaced with these defaults. Copy custom edits back by hand.
#
# ============================================================================
config-version: 3


# ============================================================================
#  Audio -- stacked flavour sounds mask the cues PvP depends on (footsteps, bows, crits).
#  Long droning sounds (beacons, conduits, the old "dragon" roar) were all replaced by short cues.
# ============================================================================
audio:
  volume: 0.6        # master multiplier for every sound the plugin plays; 0 = silent
  hit-sounds: false  # extra per-swing sounds on top of vanilla's own attack sound
  ambient: false     # flavour loops and projectile trails


# ============================================================================
#  Effects -- particles
#
#  Particles are sent to each player separately, which is what allows:
#    - density:          global thinning of every effect (0..1)
#    - /lwfx:            each player picks full / reduced / minimal / off for themselves
#    - eye-clearance:    small effects that would sit right in front of a player's eyes are
#                        not shown to that player, so nobody's view gets buried
# ============================================================================
effects:
  particles: true
  animations: true                # short ground-level ability animations (display blocks, <1s, hidden for /lwfx off)
  density: 0.4
  default-player-level: REDUCED   # FULL, REDUCED, MINIMAL or OFF for players who never ran /lwfx
  view-range: 48.0                # blocks; particles further away are not sent at all
  eye-clearance: 1.3              # blocks
  passive-auras: false            # always-on auras around HELD weapons (Sword of Eclipse). Off: they blocked vision.
  trails: true
  # Ritual altars are drawn at this strength regardless of density and /lwfx (except "off"):
  # they are a landmark people navigate to, not combat clutter.
  ritual-density: 1.0


# ============================================================================
#  HUD -- the action bar shows cooldowns, charges and meters for the weapon you hold, your
#  Veil disguise, and your bounty target during a Bounty Hunt.
# ============================================================================
hud:
  enabled: true
  message-hold-millis: 1600       # how long an ability message stays before the HUD returns


# ============================================================================
#  Protection -- abilities respect WorldGuard's pvp flag and Towny PvP (detected automatically),
#  and the world's own pvp setting. Knockback, slows, freezes, pulls and resizes all check it.
#  Block-changing abilities (Hellstorm's explosion, the water wall, SuperNova with block
#  breaking on) check build permission with a synthetic BlockBreakEvent.
# ============================================================================
protection:
  block-probe: true               # set false if a logging plugin records the synthetic events


# ============================================================================
#  How legendaries are obtained
# ============================================================================
acquisition:
  ritual-crafting: true           # legendaries are forged at a Ritual Altar
  require-fragments: true         # false strips Weapon Fragment entries from every recipe
  single-craft-per-weapon: true   # one of each legendary per server (breaking a running ritual frees it again)
  fragment-fusion: true           # fragments.fusion-cost of one tier fuse into one of the next at the altar


# ============================================================================
#  Weapon fragments -- Tier I..IV, plus the Luminosity Fragment (events only)
# ============================================================================
# DonutSMP-style amethyst tools. Give with /lwtest give AMETHYST_PICKAXE (or _SHOVEL/_AXE), the /gui
# menu, or use the tokens in loot/reward lists (they are in the late supply drop by default).
tools:
  sneak-to-disable: true      # sneaking mines a single block
  durability-per-block: 1     # per extra block broken (Unbreaking applies)
  max-hardness: 40.0          # never breaks anything harder (obsidian is 50, bedrock is unbreakable)
  blacklist: []               # extra materials the 3x3 must never touch, e.g. [ANCIENT_DEBRIS]
  axe:
    max-logs: 300
    break-leaves: true        # also clear the tree's natural leaves (drops saplings/apples)
    require-leaves: true      # only fell real trees, so log builds are safe

fragments:
  fusion-cost: 4
  # Kills by a player only. ENTITY_TYPE: "tier:chance"
  mob-drops:
    ENDER_DRAGON: "4:1.0"
    WITHER: "3:0.6"
    WARDEN: "3:0.5"
    ELDER_GUARDIAN: "2:0.4"
    RAVAGER: "2:0.1"
    EVOKER: "1:0.2"
    PIGLIN_BRUTE: "1:0.1"
    BREEZE: "1:0.05"


weapons:

  # --------------------------------------------------------------------------
  # Scythe Of Diablo -- netherite sword + Sharpness V = 11 base damage
  # --------------------------------------------------------------------------
