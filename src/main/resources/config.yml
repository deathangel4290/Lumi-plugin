      reflect-cooldown: 100             # 5s
      reflect-max-energy: 20.0
      reflect-min-energy: 2.0
      reflect-damage-per-energy: 0.6
      reflect-damage-cap: 12.0
      reflect-speed: 2.0
      reflect-range: 24.0
      ultimate-charge-max: 100.0
      ultimate-charge-per-hit: 3.0
      ultimate-charge-per-energy: 3.0
      ultimate-charge-per-ability: 10.0
      charge-drain-delay: 300
      charge-drain-per-second: 1.0
      realm-radius: 4.0
      realm-duration: 120               # 6s
      realm-damage-reduction: 0.3
    enchantments: [UNBREAKING:3]
    recipe: [SHIELD, GLASS:32, DIAMOND_BLOCK:2, FRAGMENT_T3:2]

  # --------------------------------------------------------------------------
  # Battle Horn -- team support with modest buffs. Rally: you and allies fighting near you fill the
  # meter (the horn must be in your hand or hotbar). War Cry: Speed for allies. Dreadful Roar
  # pushes and weakens enemies near you. Call to War: Strength for allies, and enemies within a
  # limited radius glow.
  # --------------------------------------------------------------------------
  battle-horn:
    display-name: "§4§lBattle Horn"
    ritual-colors: ["#C8462A", "#E0B050"]
    material: GOAT_HORN
    custom-model-data: 34
    power-tier: 2
    abilities:
      rally-radius: 12.0
      rally-charge-per-hit: 3.0         # half for hits on mobs
      war-cry-cooldown: 400             # 20s
      war-cry-radius: 10.0
      war-cry-duration: 120             # 6s
      war-cry-speed: 1                  # Speed I
      roar-cooldown: 360                # 18s
      roar-radius: 6.0
      roar-damage: 0.0
      roar-knockback: 0.9
      roar-weakness: 1                  # Weakness I
      roar-weakness-duration: 100
      ultimate-charge-max: 100.0
      ultimate-charge-per-hit: 3.0
      ultimate-charge-per-ability: 10.0
      charge-drain-delay: 300
      charge-drain-per-second: 1.0
      call-ally-radius: 12.0
      call-duration: 160                # 8s
      call-strength: 1                  # Strength I
      call-reveal-radius: 30.0
    enchantments: []
    recipe: [GOAT_HORN, BELL, GOLD_BLOCK:4, FRAGMENT_T2:2]

# ============================================================================
#  Rituals
# ============================================================================
ritual:
  timer: 900                            # SECONDS (900 = 15 minutes)
  altar-decoration: true                # small turning crystal above idle altars; false = glyph particles only
  floating-weapon:                      # the weapon hovering over the altar while it is forged
    scale: 1.5                          # 1.0 = about a block tall
    label: true                         # its name and a progress bar over it
    glow-outline: false                 # a coloured outline in the weapon's colour (shows through walls)
  # The altar is the resource pack's model (an empty spawner underneath: same mining time as an
  # enchanting table, immovable, and explosion-proof through the plugin). Existing enchanting-table
  # altars convert when their chunk loads. false = plain enchanting tables, for servers whose pack
  # is optional (players without it would see a missing-model cube).
  custom-altar: true
  # Which altars exist: CRAFTED (players craft and place their own), ANCIENT (no crafting: only the
  # few Ancient Altars set around the map, which players have to find), or BOTH.
  altar-mode: BOTH
  ancient-altars:
    max: 3                              # at most this many at once
    scatter-radius: 1500                # /lwevent altar scatter hides them within this many blocks of spawn
    label: true                         # "Ancient Altar" floats over one when you are right next to it
    announce-discovery: true            # the first player to use each one is announced (never where)
    model: "luminara:ritual_altar"      # the item model drawn over Ancient Altars (art: luminara:ancient_altar)
  # Crafting times. Ritual messages show clock times in this time zone ("done at 8:42 PM CDT").
  timezone: "America/Chicago"           # Central Time (CST/CDT); any IANA zone, e.g. "America/New_York"
  windows:
    enabled: true                       # rituals can only be STARTED in these windows (admins always can)
    announce: true                      # tell everyone when the altars wake up and fall quiet
    times:                              # "DAYS HH:MM-HH:MM" in the time zone above; DAYS = ALL, WEEKDAYS,
      - "ALL 16:00-23:59"               # WEEKEND, or MON,TUE,...  Running rituals finish whenever.
  # A weapon can take longer or shorter than ritual.timer: weapons.<weapon>.ritual-time (seconds).

ritual-block-recipe:
  enabled: true
  shape:
    - "ODO"
    - "DND"
    - "OOO"
  ingredients:
    'O': "OBSIDIAN"
    'D': "DIAMOND"
    'N': "NETHER_STAR"


# ============================================================================
#  Events -- all started by admins with /lwevent. Nothing runs on its own.
#
#  Loot entry format: "ITEM [amount or min-max] [wWEIGHT]"
#    GOLDEN_APPLE 1-4 w10                       plain item
#    ENCHANTED_BOOK:SHARPNESS:5 1 w1            enchanted book
#    POTION:STRONG_HEALING 2 w5                 potion (SPLASH_POTION / LINGERING_POTION too)
#    ENCHANTED:DIAMOND_SWORD:SHARPNESS=3,UNBREAKING=3 1 w3
#    FRAGMENT_T1..FRAGMENT_T4, LUMINOSITY_FRAGMENT, ALL_IN_ONE_POTION
#  A table has rolls (how many weighted picks), guaranteed (always) and items (the pool).
# ============================================================================
events:

  bounty:
    default-minutes: 30
    reward:
      - "LUMINOSITY_FRAGMENT 1"

  koth:
    default-minutes: 15
    radius: 5.0
    vertical-range: 4.0
    hologram-height: 3.5
    hologram-lines: 5
    win-points: 300           # first to this many points wins on the spot; 0 = highest score when time runs out
    points:
      per-second: 1           # each second you hold the hill alone
      streak-every: 30        # every 30s held without losing it...
      streak-bonus: 10        # ...earns this bonus
      capture-bonus: 5        # taking the hill from the previous king
      kill-bonus: 15          # a kill where you or your victim is on the hill
      contested-per-second: 0 # each player on a contested hill
    ring:
      enabled: true           # glowing ring of display blocks marking the edge (red while contested)
      width: 0.25
    reward:
      - "LUMINOSITY_FRAGMENT 1"

  supply-drops:
    border-margin: 50.0       # stay this far inside the world border
    max-radius: 2000.0        # drops land at most this far from the border centre (0 = anywhere in the border)
    fall-seconds: 3.0
    beam-minutes: 10.0        # beam shows until opened or this long
    # Weights are relative within a tier: everyday loot is common, the good stuff is rare.
    # No ender pearls or totems; every potion is a splash potion.
    tiers:
      early:
        rolls: "5-8"
        guaranteed:
          - "GOLDEN_APPLE 1-2"
        items:
          - "COOKED_BEEF 6-16 w20"
          - "IRON_INGOT 4-12 w20"
          - "GOLDEN_CARROT 4-12 w16"
          - "ARROW 8-24 w14"
          - "GOLD_INGOT 4-10 w12"
          - "EMERALD 2-8 w12"
          - "LAPIS_LAZULI 4-12 w10"
          - "EXPERIENCE_BOTTLE 3-8 w10"
          - "GOLDEN_APPLE 1-3 w8"
          - "SPLASH_POTION:HEALING 1-2 w8"
          - "SPLASH_POTION:SWIFTNESS 1 w6"
          - "IRON_SWORD 1 w5"
          - "IRON_PICKAXE 1 w5"
          - "IRON_HELMET 1 w4"
          - "IRON_BOOTS 1 w4"
          - "IRON_CHESTPLATE 1 w3"
          - "IRON_LEGGINGS 1 w3"
          - "SPLASH_POTION:STRONG_HEALING 1 w3"
      mid:
        rolls: "6-9"
        guaranteed:
          - "GOLDEN_APPLE 3-5"
        items:
          - "GOLDEN_APPLE 3-6 w14"
          - "GOLD_INGOT 8-16 w14"
          - "OBSIDIAN 4-10 w12"
          - "EMERALD 6-16 w12"
          - "EXPERIENCE_BOTTLE 8-16 w10"
          - "SPLASH_POTION:STRONG_HEALING 1-2 w8"
          - "WIND_CHARGE 4-12 w8"
          - "TRIAL_KEY 1-2 w6"
          - "FRAGMENT_T1 1 w5"
          - "GOLD_BLOCK 1-2 w4"
          - "BREEZE_ROD 1-3 w4"
          - "SPLASH_POTION:STRENGTH 1 w4"
          - "ENCHANTED_BOOK:PROTECTION:3 1 w4"
          - "ENCHANTED_BOOK:SHARPNESS:3 1 w4"
          - "ENCHANTED_BOOK:UNBREAKING:3 1 w4"
          - "DIAMOND_HELMET 1 w3"
          - "DIAMOND_BOOTS 1 w3"
          - "DIAMOND_SWORD 1 w3"
          - "DIAMOND_PICKAXE 1 w3"
          - "DIAMOND_CHESTPLATE 1 w2"
          - "DIAMOND_LEGGINGS 1 w2"
          - "FRAGMENT_T2 1 w2"
          - "ENCHANTED_BOOK:PROTECTION:4 1 w1"
          - "ENCHANTED_BOOK:SHARPNESS:5 1 w1"
          - "ENCHANTED_BOOK:MENDING:1 1 w1"
          - "OMINOUS_TRIAL_KEY 1 w1"
      late:
        rolls: "7-10"
        guaranteed:
          - "GOLDEN_APPLE 6-10"
          - "DIAMOND 6-12"
          - "FRAGMENT_T2 1"
        items:
          - "EMERALD_BLOCK 1-3 w14"
          - "GOLD_BLOCK 2-4 w14"
          - "SPLASH_POTION:STRONG_HEALING 2-3 w12"
          - "SPLASH_POTION:STRONG_STRENGTH 1 w8"
          - "DIAMOND_BLOCK 1 w8"
          - "NETHERITE_SCRAP 1-2 w8"
          - "FRAGMENT_T2 1 w8"
          - "ENCHANTED:DIAMOND_SWORD:SHARPNESS=5,UNBREAKING=3 1 w6"
          - "ENCHANTED:DIAMOND_HELMET:PROTECTION=4,UNBREAKING=3 1 w6"
          - "ENCHANTED:DIAMOND_BOOTS:PROTECTION=4,FEATHER_FALLING=4 1 w6"
          - "ENCHANTED:DIAMOND_CHESTPLATE:PROTECTION=4,UNBREAKING=3 1 w5"
          - "ENCHANTED:DIAMOND_LEGGINGS:PROTECTION=4,UNBREAKING=3 1 w5"
          - "ENCHANTED:DIAMOND_AXE:SHARPNESS=5,EFFICIENCY=5 1 w4"
          - "ENCHANTED:BOW:POWER=5,INFINITY=1 1 w4"
          - "FRAGMENT_T3 1 w3"
          - "ALL_IN_ONE_POTION 1 w3"
          - "NETHERITE_INGOT 1 w2"
          - "NETHERITE_UPGRADE_SMITHING_TEMPLATE 1 w2"
          - "SILENCE_ARMOR_TRIM_SMITHING_TEMPLATE 1 w1"
          - "SPIRE_ARMOR_TRIM_SMITHING_TEMPLATE 1 w1"
          - "EYE_ARMOR_TRIM_SMITHING_TEMPLATE 1 w1"
          - "ENCHANTED_GOLDEN_APPLE 1 w1"
          - "HEAVY_CORE 1 w1"
          - "AMETHYST_PICKAXE 1 w1"
          - "AMETHYST_SHOVEL 1 w1"
          - "AMETHYST_AXE 1 w1"

  # The Chosen (/chosen pick): someone without a legendary, wearing a halo. When they fight a player
  # carrying a legendary (held or not) while carrying one of these weapons (held or not), it becomes a copy of that
  # legendary (an "echo") until the fight ends. Taking up a real legendary ends the role.
  chosen:
    counterparts:              # which of the Chosen's items answer each kind of legendary (its own item kind)
      sword: [DIAMOND_SWORD, NETHERITE_SWORD]
      axe: [DIAMOND_AXE, NETHERITE_AXE]
      spear: [DIAMOND_SPEAR, NETHERITE_SPEAR]
      trident: [TRIDENT]
      bow: [BOW]
      crossbow: [CROSSBOW]
      mace: [MACE]
      book: [BOOK, WRITABLE_BOOK]
      lead: [LEAD]
      breeze_rod: [BREEZE_ROD, BLAZE_ROD]
      blaze_rod: [BLAZE_ROD, BREEZE_ROD]
      hoe: [DIAMOND_HOE, NETHERITE_HOE]
      shield: [SHIELD]
      goat_horn: [GOAT_HORN]
    fight-timeout: 15          # SECONDS without a hit between the two before the echo turns back
    max-distance: 48.0         # ...or when they are further apart than this
    include-admins: true       # admins can be picked too
    switch-offer: true         # mid-fight, someone with a different legendary: offer the Chosen [Switch] / [Keep] in chat
    pass-on-legendary: true    # the Chosen takes up a real legendary: the role goes to someone at random
    pass-on-death: true        # killed by a player without a legendary: the killer becomes the Chosen;
                               # killed by a legendary holder: someone at random does. Other deaths keep it.
    announce: true             # tell everyone who was chosen
    halo:
      enabled: true
      colour: "#FFD24A"        # turns the legendary's own colour while an echo is held
      points: 12
      radius: 0.32
      height: 0.25             # above the top of the head

  most-wanted:
    alias: "MostWanted"        # the name everyone sees; must be a valid username (letters, digits, _)
    max-health: 40.0           # 20 hearts
    speed-amplifier: 1         # Speed II
    ping-interval-seconds: 60  # broadcast a rough position this often
    ping-accuracy: 32          # +/- blocks of error on those pings
    explosion-radius: 10.0
    explosion-knockback: 2.5
    ban-on-death: true
    ban-minutes: 0             # 0 = permanent
    ban-reason: "You were the Most Wanted, and you were caught."
    centre-item: "LUMINOSITY_FRAGMENT"   # always in the middle slot of the chest
    loot:
      rolls: "6-9"
      guaranteed:
        - "ENCHANTED_GOLDEN_APPLE 2"
        - "ALL_IN_ONE_POTION 2"
        - "NETHERITE_INGOT 2"
      items:
        - "NETHERITE_HELMET 1 w2"
        - "NETHERITE_CHESTPLATE 1 w1"
        - "NETHERITE_LEGGINGS 1 w1"
        - "NETHERITE_BOOTS 1 w2"
        - "ENCHANTED:NETHERITE_SWORD:SHARPNESS=5,UNBREAKING=3 1 w1"
        - "ENCHANTED_GOLDEN_APPLE 1 w2"
        - "ALL_IN_ONE_POTION 1 w3"
        - "NETHERITE_SCRAP 2-4 w3"
        - "TOTEM_OF_UNDYING 1 w3"
        - "DIAMOND_BLOCK 1-2 w3"
        - "FRAGMENT_T3 1 w2"
        - "FRAGMENT_T4 1 w1"

  # --------------------------------------------------------------------------
  #  Shared-fight scoring (Fallen Star guardians now, bosses next).
  #  Score = your share of all damage x damage-weight + your share of mechanics
  #  (objectives, kills of adds, shields) x mechanic-weight + your share of
  #  support (holding ground, carrying, protecting) x support-weight.
  #  Players under min-share get nothing, so one tag at the end earns nothing.
  # --------------------------------------------------------------------------
  contribution:
    damage-weight: 0.6
    mechanic-weight: 0.2
    support-weight: 0.2
    min-share: 0.03

  # --------------------------------------------------------------------------
  #  Carry objectives. When a boss dies or a Fallen Star is cleared, its relic
  #  drops. Whoever holds it for hold-seconds claims it; anyone can kill the
  #  carrier and take it. The carrier glows, has it over their head, is on
  #  everyone's boss bar and has their position announced every ping-seconds.
  # --------------------------------------------------------------------------
  relics:
    ping-seconds: 10
    ping-accuracy: 6            # +/- blocks of error on the position pings
    ground-timeout-seconds: 180 # nobody picks it up for this long -> it is lost
    block-teleports: true       # carriers cannot pearl, chorus, use portals or /home
    block-elytra: true
    boss-heart:
      hold-seconds: 60
      rewards:
        rolls: "3-5"
        guaranteed:
          - "LUMINARA_TOKEN 8-12"
          - "FRAGMENT_T3 1"
        items:
          - "ENCHANTED_GOLDEN_APPLE 1-2 w6"
          - "NETHERITE_INGOT 1 w5"
          - "ALL_IN_ONE_POTION 1 w5"
          - "FRAGMENT_T3 1 w4"
          - "LUMINOSITY_FRAGMENT 1 w2"
          - "FRAGMENT_T4 1 w1"
    star-core:
      hold-seconds: 45
      rewards:
        rolls: "2-4"
        guaranteed:
          - "LUMINARA_TOKEN 4-6"
          - "FRAGMENT_T2 1"
        items:
          - "GOLDEN_APPLE 4-8 w8"
          - "DIAMOND 4-8 w8"
          - "NETHERITE_SCRAP 1-2 w5"
          - "ALL_IN_ONE_POTION 1 w4"
          - "FRAGMENT_T3 1 w3"
          - "LUMINOSITY_FRAGMENT 1 w1"

  # --------------------------------------------------------------------------
  #  Fallen Star: /lwevent fallenstar start, or the Director.
  #  Where it fell is revealed in stages: biome at once, rough distance after
  #  reveal-distance-seconds, coordinates after reveal-coords-seconds (or as
  #  soon as someone finds it). The crater only forms on natural terrain and
  #  heals restore-minutes after the core is taken.
  # --------------------------------------------------------------------------
  fallen-star:
    border-margin: 64.0
    max-radius: 1500.0          # lands at most this far from the border centre
    crater-radius: 6.0
    crater-depth: 3
    reveal-distance-seconds: 30
    reveal-coords-seconds: 60
    trigger-radius: 20.0        # a player this close wakes the guardians
    guardian-health-multiplier: 1.5   # +15% more for every player past 2
    wave-timeout-seconds: 120   # the next wave comes anyway after this long
    max-minutes: 25             # burns out if nobody finishes it
    restore-minutes: 5
    restore-minutes-failed: 1
    waves:
      - ["HUSK 4", "SKELETON 3", "SPIDER 2"]
      - ["VINDICATOR 2", "BLAZE 2", "WITHER_SKELETON 2"]
      - ["RAVAGER 1", "EVOKER 1", "WITHER_SKELETON 3"]
    rewards:                    # contribution payout when the core is freed (into /rewards)
      participant:
        rolls: "2-3"
        guaranteed:
          - "LUMINARA_TOKEN 1-2"
        items:
          - "GOLDEN_APPLE 2-4 w6"
          - "EXPERIENCE_BOTTLE 8-16 w6"
          - "DIAMOND 2-4 w4"
          - "FRAGMENT_T1 1 w3"
      top3:
        rolls: "1-2"
        items:
          - "LUMINARA_TOKEN 2 w4"
          - "FRAGMENT_T2 1 w3"
          - "NETHERITE_SCRAP 1 w2"
      top1:
        rolls: "1"
        items:
          - "LUMINARA_TOKEN 3 w3"
          - "FRAGMENT_T2 2 w2"

  # --------------------------------------------------------------------------
  #  Blood Moon: /lwevent bloodmoon start, or the Director. Rises at the next
  #  nightfall, sets at dawn. Killing a player puts a token bounty on you:
  #  whoever kills you collects it, and if you live till dawn it's yours.
  # --------------------------------------------------------------------------
  blood-moon:
    spawn-multiplier: 1.8       # monster cap x this, spawn attempts every tick
    health-multiplier: 1.5
    damage-multiplier: 1.3
    elite-chance: 0.03
    elite-health-multiplier: 3.0
    elite-damage-multiplier: 1.8
    red-tint: 0.35              # red screen-edge tint, 0 = off, 0.9 max
    elite-drops:
      - "LUMINARA_TOKEN 1"
      - "GOLDEN_APPLE 1-2"
    bounty-tokens-per-kill: 2   # Luminara Tokens added to a killer's bounty per kill
    bounty-reward:              # extra prize for collecting a blood bounty
      - "LUMINARA_TOKEN 1"


# ============================================================================
#  Event Director -- the server starts events, players react.
#  Once a day per window it picks ONE event from the window's weighted list and
#  a random time inside the window, then counts down in chat. Players know
#  something happens 9-11 PM, not what or exactly when.
#  Events: supplydrop[:early|mid|late], bounty, koth (needs a hill), fallenstar,
#  bloodmoon, boss (a random boss with an arena) or boss:<id>.
#  days: ALL, WEEKDAYS, WEEKEND or MON, TUE, ... Windows cannot cross midnight.
# ============================================================================
director:
  enabled: true
  timezone: ""                  # e.g. "America/New_York"; empty = the server's clock
  world: ""                     # empty = the main world
  min-players: 3                # waits (5 min at a time) until this many are on
  announce-minutes: [10, 5, 1]
  supply-tier: mid
  supply-count: 2
  windows:
    afternoon:
      days: [ALL]
      from: "16:00"
      to: "18:00"
      events:
        "supplydrop:early": 3
        "supplydrop:mid": 2
        bounty: 2
    evening:
      days: [ALL]
      from: "19:00"
      to: "20:30"
      events:
        koth: 3
        fallenstar: 3
        bounty: 2
        "supplydrop:mid": 1
    prime:
      days: [ALL]
      from: "21:00"
      to: "23:00"
      events:
        fallenstar: 3
        koth: 2
        bloodmoon: 2
        boss: 3                     # only once a boss arena is set (/lwevent boss arena ...)
        "supplydrop:late": 1


# ============================================================================
#  Teams -- made by a captain draft (/lwevent draft start, or the admin panel).
#  Teammates are allies: abilities skip them, no friendly fire, shared outposts.
# ============================================================================
teams:
  enabled: true
  allow-leave: false            # players can leave their own team (/team leave); admins can always move people
  allies:                       # what being on the same team means
    abilities-skip: true        # legendary abilities never hit a teammate
    friendly-fire: false        # true = teammates can still hurt each other with normal hits and arrows
    share-outposts: true        # teammates count as one side at outposts
    bounty-skips-teammates: true  # a Bounty Hunt never gives you a teammate as your target
  nametags:                     # names over heads and in the tab list
    enabled: true               # the team colour on names; false = plain names
    captain-symbol: "♛"         # shown before a captain's name ("" for none)
    captain-symbol-colour: GOLD # TEAM, or a colour: GOLD, WHITE, RED, ...
    member-symbol: "✦"          # shown before everyone else on a team ("" for none)
    member-symbol-colour: TEAM
    show-team-name: false       # also put "[Red Team]" before the name
  chat:
    enabled: true               # /tc and /team chat
    prefix: "[{team}]"          # {team} = the team's name, {symbol} = the sender's captain/member mark
    default-on: false           # newly drafted players talk to their team by default (/team chat switches)
  captains:
    can-rename: true            # captains rename their team in /team
    max-name-length: 20
    can-kick: false             # captains can remove players from their team
  draft:
    pick-seconds: 45            # each captain's time to pick
    warn-seconds: 5             # the last seconds tick for the captain
    auto-pick: true             # time runs out: a random pick (false = that turn is skipped)
    absent-captain-seconds: 5   # a captain who is offline gets only this long before the pick passes on
    order: SNAKE                # SNAKE (1 2 3 3 2 1 1 2 3 ...) or ROUND (1 2 3 1 2 3 ...)
    captain-order: CHOSEN       # CHOSEN (the order the admin picked them in) or RANDOM
    min-captains: 2
    max-team-size: 0            # 0 = no limit (the pool is shared out evenly anyway)
    team-name: "{colour} Team"  # {colour} = Red, Blue, ...; {captain} = the captain's name
    colours: [RED, BLUE, GREEN, YELLOW, AQUA, LIGHT_PURPLE, GOLD, WHITE]   # one per captain, in order
    replace-old-teams: true     # a new draft first removes earlier teams with the same name
    cancel-removes-teams: true  # cancelling a draft removes the teams it made (false = keeps them as they are)
    boss-bar: true              # everyone sees whose pick it is and the clock
    titles: true                # "Your pick!" for captains, "<team> picked you!" for players
    sounds: true
    announce-picks: true        # every pick in chat

# ============================================================================
#  Outposts -- permanent capture points (/outposts). Admins place them with
#  /lwevent outpost create <name> <type> [radius] standing at the centre.
#  Income is small on purpose so whoever takes one first cannot snowball.
# ============================================================================
outposts:
  radius: 6.0
  vertical-range: 5.0
  capture-seconds: 60           # an empty outpost; taking someone else's costs this again to neutralise
  max-per-player: 2
  income-minutes: 60            # minutes the owner is online per payout
  income-requires-online: true
  label-height: 3.0
  types:
    plains:
      display: "Plains Outpost"
      income:
        - "LUMINARA_TOKEN 1"
        - "IRON_INGOT 4-8"
        - "BREAD 6-12"
    nether:
      display: "Nether Outpost"
      income:
        - "LUMINARA_TOKEN 1"
        - "QUARTZ 8-16"
        - "GOLD_INGOT 2-6"
        - "BLAZE_ROD 1-2"
    end:
      display: "End Outpost"
      income:
        - "LUMINARA_TOKEN 2"
        - "SHULKER_SHELL 1"
        - "CHORUS_FRUIT 4-8"
    ancient:
      display: "Ancient City Outpost"
      income:
        - "LUMINARA_TOKEN 2"
        - "ECHO_SHARD 1-2"
        - "EXPERIENCE_BOTTLE 4-8"


# ============================================================================
#  Token Traders: villagers an admin places with /lwevent trader spawn. They
#  trade tokens for these offers through the villager trading screen;
#  /tokenshop tells players where they stand. "ITEM [amount] @ cost" in the
#  loot format; a trade can ask for at most two stacks (128) of tokens.
#  Kept to consumables, materials and fragments: events should not mint power
#  faster than the rituals do.
# ============================================================================
token-shop:
  offers:
    - "GOLDEN_APPLE 4 @ 1"
    - "EXPERIENCE_BOTTLE 16 @ 1"
    - "SPLASH_POTION:STRONG_HEALING 2 @ 2"
    - "WIND_CHARGE 8 @ 2"
    - "FRAGMENT_T1 1 @ 3"
    - "NAME_TAG 1 @ 2"
    - "DIAMOND 4 @ 4"
    - "NETHERITE_SCRAP 1 @ 6"
    - "FRAGMENT_T2 1 @ 8"
    - "ALL_IN_ONE_POTION 1 @ 10"
    - "ENCHANTED_GOLDEN_APPLE 1 @ 16"
    - "FRAGMENT_T3 1 @ 24"
  trader:
    protect-radius: 4.0           # only ops place/break blocks, empty buckets or light fires this close
    look-range: 8.0               # turns to face the nearest player within this
    # Custom model (template: resourcepack/_source/blockbench/templates/token_trader.bbmodel).
    # Model over the template, export it into the pack, then set enabled: true.
    model:
      # Animated model (BetterModel plugin), used instead of the static one when set and loaded.
      bettermodel: "token_trader"   # greet when someone walks up, trade when the shop opens
      bettermodel-scale: 1.0
      enabled: false
      scale: 0.975                # template units -> blocks (32 units = a villager's 1.95)
      hide-body: true
      states:
        idle: "luminara:token_trader"


# ============================================================================
#  Bosses -- /lwevent boss arena <boss> [radius] (stand at the centre), then
#  /lwevent boss start <boss> or let the Director pick "boss". One at a time.
#
#  Shared rules for every boss:
#    health            pool for one fighter; + health-per-player for each extra
#                      fighter (also when people join mid-fight), capped at
#                      health x max-health-multiplier
#    damage-multiplier everything the boss and its summons deal, including the
#                      armour-ignoring hits below (their numbers are before it)
#    feed-heal         a player dying in the arena heals the boss this fraction
#                      and makes it hit 10% harder (stacks to 5) for feed-seconds
#    arrive-minutes    time people get to reach the arena before anyone counts as missing (5)
#    leave-seconds     nobody in the arena this long -> it retreats (no rewards)
#    max-minutes       the fight ends unrewarded after this long
#    phases            pool fractions where phases begin (highest first)
#    rewards           contribution payout (participant / top3 / top1 tables)
#                      before the Boss Heart drops
#
#  MODELS (optional): give a boss a model section and the vanilla mob turns
#  invisible with the model riding it. Each state is an item model id
#  ("luminara:hollow_warden_idle", i.e. assets/luminara/items/hollow_warden_idle.json)
#  or a custom_model_data number on model.item. States the bosses use:
#    all:            idle, attack, enraged
#    hollow_warden:  roar
#    wither_king:    landed (phase 4 body)
#    leviathan:      surfaced
#    ender_colossus: cast
#  A missing state falls back to idle. Other model settings (all optional):
#    bettermodel: <name>      use this BetterModel model instead (animated; needs BetterModel)
#    bettermodel-scale: 1.0   its size      animations: {state: animation}  rename what plays
#    scale / offset-y / yaw-offset   size, height and turn of an item-model body
#    hide-body: true          hide the vanilla mob under the model
#    view-range: 2.0          how far away the model is drawn (1.0 = a normal mob)
#    item: PAPER              the item a custom_model_data state is drawn on
#    once: [attack, ...]      states that play once instead of looping
#  Example:
#    model:            each boss has a ready template wired up (enabled: false):
#      enabled: true   see docs/BOSS_MODELS.md and resourcepack/_source/blockbench/templates/
#      scale: 1.32
#      states:
#        idle: "luminara:boss_hollow_warden"
#        attack: "luminara:boss_hollow_warden_attack"   (optional extra states)
# ============================================================================
bosses:
  hollow_warden:
    enabled: true
    arena-radius: 22
    scale: 1.3
    health: 900
    health-per-player: 0.35
    max-health-multiplier: 4.0
    damage-multiplier: 1.2
    feed-heal: 0.04
    feed-seconds: 30
    leave-seconds: 120
    max-minutes: 20
    phases: [0.66, 0.33]
    sonic-interval: 12            # seconds between sonic lines
    sonic-interval-enraged: 8
    sonic-warning-ticks: 30       # how long the line is marked before it fires
    sonic-length: 24
    sonic-width: 1.4
    sonic-damage: 12              # ignores armour
    node-charge-per-second: 25
    node-drain-per-second: 12
    tendril-interval: 18
    tendril-seconds: 6
    tendril-damage-per-second: 1
    tendril-slam-damage: 10
    adapt-window-seconds: 20      # it learns from the last 20s of damage
    adapt-share: 0.55             # one kind doing 55%+ of it...
    adapt-minimum-damage: 60
    adapt-seconds: 20             # ...is resisted this long
    adapted-damage: 0.35
    eruption-interval: 15         # sculk spikes under the loudest players
    eruption-targets: 2
    eruption-radius: 2.5
    eruption-damage: 9            # ignores armour
    roar-interval: 20             # from 66%: a ground shockwave; jump over it
    roar-radius: 16
    roar-damage: 10               # ignores armour
    # Custom model (template: resourcepack/_source/blockbench/templates/boss_hollow_warden.bbmodel).
    # Model over the template, export it into the pack, then set enabled: true.
    model:
      # Animated model (BetterModel plugin; used instead of the static one below when both exist).
      # The name of a model in plugins/BetterModel/models. Its idle/walk/spawn play on their own;
      # the boss's states play animations of the same name (attack, roar once; enraged lasting).
      # attack also plays on each melee hit.
      bettermodel: "hollow_warden"
      bettermodel-scale: 1.0      # on top of the mob's own scale
      # animations: {attack: "swipe"}   # if an animation is named differently from the state
      enabled: false
      scale: 1.32
      hide-body: true
      states:
        idle: "luminara:boss_hollow_warden"
    rewards:
      participant:
        rolls: "2-3"
        guaranteed: ["LUMINARA_TOKEN 2-3"]
        items: ["GOLDEN_APPLE 3-6 w6", "EXPERIENCE_BOTTLE 12-24 w6", "DIAMOND 3-6 w4", "ECHO_SHARD 1-3 w4", "FRAGMENT_T2 1 w3"]
      top3:
        rolls: "1-2"
        items: ["LUMINARA_TOKEN 3 w4", "FRAGMENT_T2 1 w3", "NETHERITE_SCRAP 1-2 w3", "SILENCE_ARMOR_TRIM_SMITHING_TEMPLATE 1 w1"]
      top1:
        rolls: "1"
        items: ["FRAGMENT_T3 1 w3", "LUMINARA_TOKEN 5 w3"]

  wither_king:
    enabled: true
    arena-radius: 26
    scale: 1.4
    health: 1100
    health-per-player: 0.35
    max-health-multiplier: 4.0
    damage-multiplier: 1.5
    feed-heal: 0.04
    feed-seconds: 30
    leave-seconds: 120
    max-minutes: 25
    phases: [0.7, 0.4, 0.15]
    anchor-health: 60             # North: melee damage to break (+25% per extra fighter, as are the others)
    anchor-skulls: 5              # South: skulls that must burst beside it
    lure-interval: 3              # South: seconds between aimed skulls at whoever stands by it
    anchor-stand-seconds: 15      # East
    anchor-kills: 6               # West
    wither-on-hit-seconds: 4      # Wither II on everything the King and its court hit
    volley-interval: 6            # a leading skull at every fighter, from the start
    soul-beam-interval: 12
    soul-beam-damage: 10          # ignores armour; locks its aim 0.6s before firing
    nova-interval: 22             # from 70%
    nova-radius: 9
    nova-damage: 11               # ignores armour (x damage-multiplier: ~8 hearts)
    rain-interval: 9
    landed-scale: 2.6
    landed-attack-damage: 12
    landed-summons: 2             # wither skeletons per slam (4 alive at most)
    slam-interval: 8
    slam-radius: 6
    slam-damage: 10               # ignores armour (x damage-multiplier)
    leap-interval: 7              # leaps at the furthest player
    leap-radius: 3.5
    leap-damage: 9
    restore-seconds: 20           # the withered ground heals this long after the fight
    # Custom model (template: resourcepack/_source/blockbench/templates/boss_wither_king.bbmodel, and _landed for phase 4).
    # Model over the template, export it into the pack, then set enabled: true.
    model:
      # Animated model (BetterModel plugin; used instead of the static one below when both exist).
      # The name of a model in plugins/BetterModel/models. Its idle/walk/spawn play on their own;
      # the boss's states play animations of the same name (attack once, also on each melee hit;
      # enraged, landed lasting).
      bettermodel: "wither_king"
      bettermodel-scale: 1.0      # on top of the mob's own scale
      # animations: {attack: "swipe"}   # if an animation is named differently from the state
      bettermodel-landed: "wither_king_landed"   # its spawn animation tears the wings off
      enabled: false
      scale: 2.06
      hide-body: true
      states:
        idle: "luminara:boss_wither_king"
        landed: "luminara:boss_wither_king_landed"
    rewards:
      participant:
        rolls: "2-3"
        guaranteed: ["LUMINARA_TOKEN 2-3"]
        items: ["GOLDEN_APPLE 3-6 w6", "WITHER_SKELETON_SKULL 1 w2", "NETHERITE_SCRAP 1 w3", "DIAMOND 3-6 w4", "FRAGMENT_T2 1 w3"]
      top3:
        rolls: "1-2"
        items: ["LUMINARA_TOKEN 3 w4", "NETHER_STAR 1 w2", "FRAGMENT_T2 1 w3", "RIB_ARMOR_TRIM_SMITHING_TEMPLATE 1 w1"]
      top1:
        rolls: "1"
        items: ["FRAGMENT_T3 1 w3", "LUMINARA_TOKEN 5 w3"]

  leviathan:
    enabled: true
    arena-radius: 28              # set the centre over open water (a platform there is fine)
    scale: 1.3                    # the Elder Guardian body: its 2.6-block box matches the serpent's body (the model x1.692 keeps it 2.2x)
    health: 1000
    health-per-player: 0.35
    max-health-multiplier: 4.0
    damage-multiplier: 1.4
    feed-heal: 0.04
    feed-seconds: 30
    leave-seconds: 120
    max-minutes: 20
    phases: [0.6, 0.3]
    surface-interval: 18          # seconds under water between surfacings
    surface-interval-enraged: 12
    surface-seconds: 7
    surfaced-damage-multiplier: 1.6
    lost-trident-multiplier: 1.75 # the Lost Trident of Atlantis, thrown or swung
    drag-interval: 14
    drag-strength: 1.2
    drag-damage: 4
    bolt-interval: 6
    bolt-damage: 6
    whirlpool-interval: 20
    whirlpool-seconds: 8
    whirlpool-radius: 4.5
    whirlpool-damage: 2
    summon-interval: 25
    flood-interval: 30
    geyser-interval: 13           # the water under everyone erupts
    geyser-radius: 2.2
    geyser-damage: 8              # ignores armour
    wave-interval: 18             # from 60%: a wall of water across the arena
    wave-width: 9
    wave-length: 34
    wave-damage: 9                # ignores armour (x damage-multiplier)
    restore-seconds: 20
    # Custom model (template: resourcepack/_source/blockbench/templates/boss_leviathan.bbmodel).
    # Model over the template, export it into the pack, then set enabled: true.
    model:
      # Animated model (BetterModel plugin; used instead of the static one below when both exist).
      # The name of a model in plugins/BetterModel/models. Its idle/walk/spawn play on their own;
      # the boss's states play animations of the same name (attack once on each melee hit;
      # surfaced lasting).
      bettermodel: "leviathan"
      bettermodel-scale: 1.692    # x the body's 1.3 = the serpent at 2.2x; its b_ hitboxes cover head, neck and tail
      # animations: {attack: "swipe"}   # if an animation is named differently from the state
      enabled: false
      scale: 2.67
      hide-body: true
      states:
        idle: "luminara:boss_leviathan"
    rewards:
      participant:
        rolls: "2-3"
        guaranteed: ["LUMINARA_TOKEN 2-3"]
        items: ["GOLDEN_APPLE 3-6 w6", "PRISMARINE_CRYSTALS 8-16 w5", "NAUTILUS_SHELL 1-2 w4", "DIAMOND 3-6 w4", "FRAGMENT_T2 1 w3"]
      top3:
        rolls: "1-2"
        items: ["LUMINARA_TOKEN 3 w4", "HEART_OF_THE_SEA 1 w2", "FRAGMENT_T2 1 w3", "TIDE_ARMOR_TRIM_SMITHING_TEMPLATE 1 w1"]
      top1:
        rolls: "1"
        items: ["FRAGMENT_T3 1 w3", "LUMINARA_TOKEN 5 w3"]

  ender_colossus:
    enabled: true
    arena-radius: 24
    scale: 3.0
    health: 950
    health-per-player: 0.35
    max-health-multiplier: 4.0
    damage-multiplier: 1.4
    feed-heal: 0.04
    feed-seconds: 30
    leave-seconds: 120
    max-minutes: 20
    phases: [0.6, 0.3]
    swap-interval: 12
    banish-interval: 15
    pull-interval: 18
    pull-damage: 6
    decoys: 3
    decoy-health: 30
    decoy-seconds: 20
    decoy-interval: 30
    scramble-interval: 20
    rift-interval: 16             # rifts open under people, pull in, then collapse
    rifts: 3
    rift-radius: 3
    rift-damage: 9                # ignores armour
    stomp-interval: 14            # from 60%: it drops out of the sky onto someone
    stomp-radius: 3.5
    stomp-damage: 10              # ignores armour (x damage-multiplier: ~7 hearts)
    # Custom model (template: resourcepack/_source/blockbench/templates/boss_ender_colossus.bbmodel).
    # Model over the template, export it into the pack, then set enabled: true.
    model:
      # Animated model (BetterModel plugin; used instead of the static one below when both exist).
      # The name of a model in plugins/BetterModel/models. Its idle/walk/spawn play on their own;
      # the boss's states play animations of the same name (cast, and attack on each melee hit,
      # once; enraged lasting).
      bettermodel: "ender_colossus"   # decoys wear it too
      bettermodel-scale: 1.0      # on top of the mob's own scale
      # animations: {attack: "swipe"}   # if an animation is named differently from the state
      enabled: false
      scale: 2.9
      hide-body: true
      states:
        idle: "luminara:boss_ender_colossus"
    rewards:
      participant:
        rolls: "2-3"
        guaranteed: ["LUMINARA_TOKEN 2-3"]
        items: ["GOLDEN_APPLE 3-6 w6", "SHULKER_SHELL 1-2 w4", "CHORUS_FRUIT 8-16 w4", "DIAMOND 3-6 w4", "FRAGMENT_T2 1 w3"]
      top3:
        rolls: "1-2"
        items: ["LUMINARA_TOKEN 3 w4", "ELYTRA 1 w1", "FRAGMENT_T2 1 w3", "SPIRE_ARMOR_TRIM_SMITHING_TEMPLATE 1 w1"]
      top1:
        rolls: "1"
        items: ["FRAGMENT_T3 1 w3", "LUMINARA_TOKEN 5 w3"]

# ============================================================================
#  Trust system -- stops your own team eating your abilities
# ============================================================================
trust-system:
  prevent-ability-damage: true
  prevent-melee-damage: true
  prevent-projectile-damage: true


# ============================================================================
#  Messages -- '&' colour codes
# ============================================================================
messages:
  prefix: "&6[LumiWeapons]&r"
  cooldown-message: "&cThis ability is on cooldown!"
