      - "§7Ability  §f»  §7SuperNova: leap and slam the ground"
      - "§8  Up to {h:supernova-damage} hearts, never more than {pct:supernova-max-health-fraction} of a target's health."
      - "§8  Everyone it hits glows for {s:supernova-glow-duration}."
      - ""
      - "§8Usable from {n:supernova-min-charge}%. The meter drains out of combat."
    abilities:
      dash-charges: 2
      dash-recharge: 160                # 8s per charge
      dash-lockout: 60                  # 3s after the last charge is spent
      dash-power: 1.5
      dash-lift: 0.35
      ultimate-charge-max: 100.0
      ultimate-charge-per-hit: 8.0      # 13 hits to full
      charge-from-mobs: false
      ultimate-victim-cooldown: 10      # the same victim can feed the meter every 0.5s
      charge-drain-delay: 200           # 10s out of combat before draining
      charge-drain-per-second: 2.0
      supernova-min-charge: 25.0
      supernova-windup: 10              # 0.5s hover + warning before the slam
      supernova-launch: 0.9
      supernova-slam-velocity: -2.2
      supernova-max-fall-ticks: 60
      supernova-radius: 7.0             # at 100%; scales down with charge
      supernova-damage: 20.0            # at 100%, directly below; falls off squared; armour applies
      supernova-max-health-fraction: 0.6
      supernova-knockback: 1.8
      supernova-glow-duration: 60      # ticks targets hit by SuperNova glow (0 = off)
      supernova-break-blocks: false     # only where the user may build, even when on
      supernova-block-power: 2.0
    enchantments:
      - "DENSITY:5"
      - "UNBREAKING:3"
    recipe:
      - MACE
      - NETHER_STAR
      - END_CRYSTAL:4
      - FRAGMENT_T4:2
      - LUMINOSITY_FRAGMENT:3

  # --------------------------------------------------------------------------
  # Veil of Mimicry -- a book. Deals no damage at all.
  # The wearer keeps their own UUID, so bans, permissions and UUID-based logs are unaffected.
  # Disguised chat is written with the REAL sender to the console and veil-chat.log, and shown
  # to anyone with legendaryweapons.veil.spy, so a disguise can never be used to frame someone.
  # --------------------------------------------------------------------------
  veil-of-mimicry:
    display-name: "§5§lVeil of Mimicry"
    material: BOOK
    custom-model-data: 12
    power-tier: 3
    lore:
      - "§8Wear a face that is not yours."
      - ""
      - "§7Ability  §f»  §7become any player who has joined"
      - "§8  Their name, their skin, their chat."
      - ""
      - "§7Fails if anyone within {n:witness-range} blocks can see you"
      - "§7Anyone within {n:sound-mask-range} blocks hears it happen"
      - "§7Breaks when you attack, take {h:break-damage-threshold}+ hearts,"
      - "§7or use the book again"
      - ""
      - "§7Cooldown  §f»  §f{s:morph-cooldown}"
    abilities:
      morph-cooldown: 4800              # 4 minutes, after a successful morph
      failed-morph-cooldown: 200        # 10s when someone saw you
      witness-range: 20.0
      witness-fov-degrees: 110.0        # a witness has to be facing you
      sound-mask-range: 16.0
      break-damage-threshold: 8.0       # 4 hearts in one hit
      tell-chance: 0.25                 # lighter hits: chance of a brief particle glitch
      tell-duration: 20
      allow-online-targets: true
      require-skin: true                # refuse a morph when no skin can be found
      custom-nametag: true              # guaranteed floating name tag; vanilla tag hidden by team
    enchantments: []
    recipe:
      - BOOK
      - ECHO_SHARD:16
      - NAME_TAG
      - FRAGMENT_T3:2

  # --------------------------------------------------------------------------
  # Tether Chain -- a lead-style weapon. Hooks a target and drags them to you. A target caught
  # mid-dash (Hermes, Luminosity) cannot dash again for a few seconds.
  # --------------------------------------------------------------------------
  tether-chain:
    display-name: "§7§lTether Chain"
    material: LEAD
    custom-model-data: 13
    power-tier: 2
    lore:
      - "§8Nobody outruns the chain."
      - ""
      - "§7Ability  §f»  §7throw a hook up to {n:hook-range} blocks"
      - "§8  Drags whoever it catches to you."
      - "§7Catch someone mid-dash  §f»  §7no dashing for {s:dash-lock-duration}"
      - ""
      - "§7Cooldown  §f»  §f{s:hook-cooldown}"
    abilities:
      hook-cooldown: 240                # 12s
      hook-range: 18.0
      pull-strength: 1.3
      pull-lift: 0.35
      hook-slowness-duration: 20        # 1s of Slowness I after the pull
      dash-lock-duration: 60            # 3s
    enchantments:
      - "UNBREAKING:3"
    recipe:
      - LEAD:4
      - IRON_BLOCK:4
      - TRIPWIRE_HOOK:2
      - FRAGMENT_T2:2


# ============================================================================
#  Rituals
# ============================================================================
ritual:
  timer: 900                            # SECONDS (900 = 15 minutes)
  altar-decoration: true                # small turning crystal above idle altars; false = glyph particles only

ritual-block-recipe:
  enabled: true
  shape:
    - "ODO"
    - "DND"
    - "OOO"
  ingredients:
    'O': "OBSIDIAN"
    'D': "DIAMOND"
    'N': "NETHER_STAR"


# ============================================================================
#  Events -- all started by admins with /lwevent. Nothing runs on its own.
#
#  Loot entry format: "ITEM [amount or min-max] [wWEIGHT]"
#    GOLDEN_APPLE 1-4 w10                       plain item
#    ENCHANTED_BOOK:SHARPNESS:5 1 w1            enchanted book
#    POTION:STRONG_HEALING 2 w5                 potion (SPLASH_POTION / LINGERING_POTION too)
#    ENCHANTED:DIAMOND_SWORD:SHARPNESS=3,UNBREAKING=3 1 w3
#    FRAGMENT_T1..FRAGMENT_T4, LUMINOSITY_FRAGMENT, ALL_IN_ONE_POTION
#  A table has rolls (how many weighted picks), guaranteed (always) and items (the pool).
# ============================================================================
events:

  bounty:
    default-minutes: 30
    reward:
      - "LUMINOSITY_FRAGMENT 1"

  koth:
    default-minutes: 15
    radius: 5.0
    vertical-range: 4.0
    hologram-height: 3.5
    hologram-lines: 5
    win-points: 300           # first to this many points wins on the spot; 0 = highest score when time runs out
    points:
      per-second: 1           # each second you hold the hill alone
      streak-every: 30        # every 30s held without losing it...
      streak-bonus: 10        # ...earns this bonus
      capture-bonus: 5        # taking the hill from the previous king
      kill-bonus: 15          # a kill where you or your victim is on the hill
      contested-per-second: 0 # each player on a contested hill
    ring:
      enabled: true           # glowing ring of display blocks marking the edge (red while contested)
      width: 0.25
    reward:
      - "LUMINOSITY_FRAGMENT 1"

  supply-drops:
    border-margin: 50.0       # stay this far inside the world border
    max-radius: 0.0           # >0 also caps the distance from the border centre
    fall-seconds: 3.0
    beam-minutes: 10.0        # beam shows until opened or this long
    # Weights are relative within a tier: everyday loot is common, the good stuff is rare.
    # No ender pearls or totems; every potion is a splash potion.
    tiers:
      early:
        rolls: "5-8"
        guaranteed:
          - "GOLDEN_APPLE 1-2"
        items:
          - "COOKED_BEEF 6-16 w20"
          - "IRON_INGOT 4-12 w20"
          - "GOLDEN_CARROT 4-12 w16"
          - "ARROW 8-24 w14"
          - "GOLD_INGOT 4-10 w12"
          - "EMERALD 2-8 w12"
          - "LAPIS_LAZULI 4-12 w10"
          - "EXPERIENCE_BOTTLE 3-8 w10"
          - "GOLDEN_APPLE 1-3 w8"
          - "SPLASH_POTION:HEALING 1-2 w8"
          - "SPLASH_POTION:SWIFTNESS 1 w6"
          - "IRON_SWORD 1 w5"
          - "IRON_PICKAXE 1 w5"
          - "IRON_HELMET 1 w4"
          - "IRON_BOOTS 1 w4"
          - "IRON_CHESTPLATE 1 w3"
          - "IRON_LEGGINGS 1 w3"
          - "SPLASH_POTION:STRONG_HEALING 1 w3"
      mid:
        rolls: "6-9"
        guaranteed:
          - "GOLDEN_APPLE 3-5"
        items:
          - "GOLDEN_APPLE 3-6 w14"
          - "GOLD_INGOT 8-16 w14"
          - "OBSIDIAN 4-10 w12"
          - "EMERALD 6-16 w12"
          - "EXPERIENCE_BOTTLE 8-16 w10"
          - "SPLASH_POTION:STRONG_HEALING 1-2 w8"
          - "WIND_CHARGE 4-12 w8"
          - "TRIAL_KEY 1-2 w6"
          - "FRAGMENT_T1 1 w5"
          - "GOLD_BLOCK 1-2 w4"
          - "BREEZE_ROD 1-3 w4"
          - "SPLASH_POTION:STRENGTH 1 w4"
          - "ENCHANTED_BOOK:PROTECTION:3 1 w4"
          - "ENCHANTED_BOOK:SHARPNESS:3 1 w4"
          - "ENCHANTED_BOOK:UNBREAKING:3 1 w4"
          - "DIAMOND_HELMET 1 w3"
          - "DIAMOND_BOOTS 1 w3"
          - "DIAMOND_SWORD 1 w3"
          - "DIAMOND_PICKAXE 1 w3"
          - "DIAMOND_CHESTPLATE 1 w2"
          - "DIAMOND_LEGGINGS 1 w2"
          - "FRAGMENT_T2 1 w2"
          - "ENCHANTED_BOOK:PROTECTION:4 1 w1"
          - "ENCHANTED_BOOK:SHARPNESS:5 1 w1"
          - "ENCHANTED_BOOK:MENDING:1 1 w1"
          - "OMINOUS_TRIAL_KEY 1 w1"
      late:
        rolls: "7-10"
        guaranteed:
          - "GOLDEN_APPLE 6-10"
          - "DIAMOND 6-12"
          - "FRAGMENT_T2 1"
        items:
          - "EMERALD_BLOCK 1-3 w14"
          - "GOLD_BLOCK 2-4 w14"
          - "SPLASH_POTION:STRONG_HEALING 2-3 w12"
          - "SPLASH_POTION:STRONG_STRENGTH 1 w8"
          - "DIAMOND_BLOCK 1 w8"
          - "NETHERITE_SCRAP 1-2 w8"
          - "FRAGMENT_T2 1 w8"
