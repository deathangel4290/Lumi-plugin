name: LegendaryWeapons
version: ${project.version}
main: com.legendaryweapons.LegendaryWeapons
api-version: 1.21
description: Luminara legendary weapons, rituals, fragments, events, outposts and seasons.
softdepend: [WorldGuard, Towny]
commands:
  recipes:
    description: Shows the recipes for legendary weapons.
    usage: /recipes
  binds:
    description: Binds a legendary weapon ability to a key.
    usage: /binds [unbind]
  unbind:
    description: Clears your legendary weapon ability bind.
    usage: /unbind
  wpspark:
    description: Fires the held legendary's ability. Bind this to any key with a client keybind mod such as CommandKeys.
    usage: /wpspark [alt]
    aliases: [spark, wps]
  lwfx:
    description: Sets how many legendary weapon particles you see.
    usage: /lwfx <full|reduced|minimal|off>
  lw:
    description: Admin commands for LegendaryWeapons.
    usage: /lw <subcommand>
    permission: legendaryweapons.admin
  giveritualblock:
    description: Gives the player a ritual block.
    usage: /giveritualblock
    permission: legendaryweapons.admin
  gui:
    description: Opens the legendary weapon give-menu (testing).
    usage: /gui
    permission: legendaryweapons.admin
  resetcd:
    description: Resets all legendary cooldowns, dash charges and locks (testing).
    usage: /resetcd [player]
    permission: legendaryweapons.admin
  setkills:
    description: Sets the kill count on a kill-based weapon (testing).
    usage: /setkills <amount> [player] [weapon]
    permission: legendaryweapons.admin
  charge:
    description: Fills the ultimate meter of a charged weapon (testing).
    usage: /charge [percent] [player] [weapon]
    permission: legendaryweapons.admin
  lwtest:
    description: More testing tools (reset effects, finish rituals, fragments).
    usage: /lwtest <reset|finishrituals|fragments|give>
    permission: legendaryweapons.admin
  lwevent:
    description: Starts and stops events, and runs the Event Director, outposts and seasons.
    usage: /lwevent <bounty|koth|supplydrop|mostwanted|fallenstar|bloodmoon|director|outpost|season|status|stopall>
    permission: legendaryweapons.admin
  renown:
    description: Season Renown, your stats and the leaderboards.
    usage: /renown [player] | /renown top [category]
    aliases: [season, leaderboard, lb]
  rewards:
    description: Opens your reward chest (event prizes, outpost income).
    usage: /rewards
    aliases: [rewardchest]
  tokenshop:
    description: Shows where the Token Traders stand.
    usage: /tokenshop
    aliases: [tokens]
  outposts:
    description: Lists every outpost and who holds it.
    usage: /outposts
  trust:
    description: Trusts a player.
    usage: /trust <player>
  untrust:
    description: Untrusts a player.
    usage: /untrust <player>
  trustlist:
    description: Shows your trusted players.
    usage: /trustlist
permissions:
  legendaryweapons.admin:
    description: Grants access to admin, testing and event commands.
    default: op
  legendaryweapons.veil.spy:
    description: See who is really speaking when a disguised player chats.
    default: op
